# A host that no longer resolves is dead for every viewer, and nothing in the
# pipeline notices on its own.
#
# turbovidhls.com served 6 of 6 samples in the liveness pass on 2026-09-27 and
# had lost its A record before 2026-10-05. Nothing re-read that verdict, so for
# eight days it shipped as a live player on 312,296 entries, and 3,453 pages
# carried it as their LAST player: open one and every button is dead. The record
# stayed clean and well formed the whole time, so every check that reads the
# data for corruption passed. A liveness verdict is a measurement with a
# timestamp, not a fact, and this is the thing that gives it an expiry.
#
# No pip install and no secrets to probe with: DNS is the one signal that is not
# an opinion about the caller. These hosts fingerprint TLS and 403 scripted
# clients from any IP, so a refused connection proves nothing, while NXDOMAIN
# comes from the registry and means the same thing from every vantage point.
# Host names are hashed in this log; the named report goes to the email.
name: host-dns

on:
  schedule:
    - cron: '20 6 * * *'
  workflow_dispatch:
    inputs:
      max_age_days:
        description: 'days before the liveness snapshot counts as stale'
        default: '7'

concurrency:
  group: host-dns
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Refuse to start without the deploy key
        env:
          KEY: ${{ secrets.PIPELINE_DEPLOY_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::error::PIPELINE_DEPLOY_KEY is not set on this repository, so the private code cannot be checked out"
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          repository: ${{ vars.PRIVATE_REPO }}
          ref: main
          ssh-key: ${{ secrets.PIPELINE_DEPLOY_KEY }}
          path: code

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Nothing to install. The check is stdlib only on purpose: a DNS probe
      # that needs a dependency tree is a DNS probe that can fail for reasons
      # that have nothing to do with DNS.
      - name: Resolve every host we publish
        id: probe
        working-directory: code
        continue-on-error: true
        run: |
          rc=0
          python scripts/watch/host_dns.py \
            --max-age-days "${{ github.event.inputs.max_age_days || 7 }}" \
            --report ../dns.txt > ../dns.log 2>&1 || rc=$?
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          cat ../dns.log

      - name: Say only what is safe to say in public
        run: |
          echo "status:   ${{ steps.probe.outputs.status || 'unknown' }}"
          echo "gone:     ${{ steps.probe.outputs.gone || '0' }} host(s) with no A record"
          echo "findings: ${{ steps.probe.outputs.findings || '0' }}"
          echo "exit:     ${{ steps.probe.outputs.rc }} (2 = could not judge)"

      - name: Mail
        if: always() && steps.probe.outputs.rc == '1'
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 scripts/mail.py \
            --subject "[watch] a published host no longer resolves (${{ steps.probe.outputs.gone || '?' }} gone)" \
            --note "A host with no A record is dead for every viewer. Pages whose last player sits on it have no working button at all. The named hosts are in the report; the log hashes them." \
            --body-file dns.txt --body-file dns.log

      # Red on a real finding only. Exit 2 means the resolver, not the hosts,
      # is what the run measured, and going red for that trains the alarm away.
      - name: Fail
        if: steps.probe.outputs.rc == '1'
        run: exit 1
