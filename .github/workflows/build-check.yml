# Do the tests pass and does the site still build from the committed catalogue?
#
# This used to run on every push in the private repo, which billed that
# account's minutes. Here it is nightly and on dispatch. The trade is real and
# deliberate: a bad commit is now caught within a day rather than within a
# minute, and the run costs nothing. Dispatch it by hand before anything that
# matters.
#
# This repo is public, so no step may print what it built. Output goes to a
# file and the tail is emailed on failure.
name: build-check

on:
  schedule:
    - cron: '40 2 * * *'
  workflow_dispatch:

concurrency:
  group: build-check
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      # Refuse to start without the deploy key, and say so in plain words. An
      # empty secret makes actions/checkout drop the ssh-key input silently
      # and fall back to the API with this public repo's token, which reports
      # "Not Found - get-a-repository". That reads like a wrong repo name, and
      # it cost nine days and one wrong diagnosis before the step's printed
      # inputs showed there was no ssh-key line at all.
      - name: Refuse to start without the deploy key
        env:
          KEY: ${{ secrets.PIPELINE_DEPLOY_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::error::PIPELINE_DEPLOY_KEY is not set on this repository, so the private code cannot be checked out"
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          repository: ${{ vars.PRIVATE_REPO }}
          # Pinned so the branch is never resolved through the API. That lookup
          # is what produced "Not Found - get-a-repository" on every run since
          # the split, but it was the symptom: it only happens when ssh-key is
          # EMPTY, and the step above now refuses to start in that case.
          ref: main
          ssh-key: ${{ secrets.PIPELINE_DEPLOY_KEY }}
          path: code

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install
        run: |
          python -m pip install --upgrade pip >/dev/null
          pip install -r code/requirements.txt pytest >/dev/null

      # One step per check so the email names which one failed. Each keeps its
      # own log file, and no log is ever printed here.
      - name: Run the checks
        id: checks
        working-directory: code
        run: |
          rc=0
          run() {
            name=$1; shift
            if "$@" > "../$name.log" 2>&1; then echo "$name: ok"
            else echo "$name: FAILED"; echo "$name" >> ../failed.txt; rc=1; fi
          }
          run tests    python -m pytest tests/ -q
          # The catalogue is committed, so the build is reproducible here. This
          # is the check that catches a duplicate slug silently overwriting a
          # page. example.invalid keeps the real host out of a public log.
          run build    python site/build.py --base-url https://example.invalid
          run verify   python site/verify.py
          # Cheap invariant with a history: the crawler once stored ad frames
          # and cam-site redirects as players.
          run hosts    python scripts/check/embed_hosts.py
          # A fleet script that reports progress it did not verify per slice
          # once called a 12-box crawl complete while 6 boxes had written zero
          # rows: 26,904 codes reported crawled and never were.
          run fleet    python scripts/ci/check_fleet_scripts.py
          # The build drops a dead embed only if the sidecar says so, so a
          # sidecar that goes missing or stops regenerating silently stops the
          # dropping while everything stays green. The first full pass has
          # landed, so an empty sidecar is now a real failure.
          run sidecar  python scripts/ci/check_dead_embeds_sidecar.py
          # A loop variable reused a page URL and 10,896 live pages told search
          # engines their canonical was an MP4. The build is right here, so this
          # runs against dist rather than production.
          run canonical python scripts/ci/check_canonical.py --n 2000
          # Rows that reach the merge but cannot reach the output. A host in
          # neither the alive nor the refuse set is not refused, it is absent,
          # and its rows are dropped before anything counts them: 70.8% of held
          # player URLs were in that state on 2026-09-21.
          run stage    python scripts/ci/check_stage_yield.py
          echo "failed=$(tr '\n' ' ' < ../failed.txt 2>/dev/null)" >> "$GITHUB_OUTPUT"
          exit $rc

      # Advisory, deliberately not part of `run` above. This reports a standing
      # policy question, not a regression: an HTML probe can still award first
      # place to a provider nobody has watched play. Blocking the nightly build
      # on a decision nobody has made yet trains people to ignore the colour.
      # It becomes blocking the day the cap is adopted.
      - name: Ranking floor (advisory)
        working-directory: code
        continue-on-error: true
        run: python scripts/ci/check_ranking_floor.py --report ../ranking.md || true

      - name: Mail on failure
        if: failure()
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          files=""
          for f in tests build verify hosts fleet sidecar canonical stage ranking; do [ -s "$f.log" ] && files="$files --body-file $f.log"; done
          python3 scripts/mail.py \
            --subject "[build] failed: ${{ steps.checks.outputs.failed || 'setup' }}" \
            --note "Nightly build check failed." $files
